<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Ticket Staff Login | Flying Fox
    </title>

     <!-- =====================================================
     FLYING FOX FAVICONS
===================================================== -->

<link rel="icon"
      type="image/x-icon"
      href="{% static 'frontend/assets/img/favicon/favicon.ico' %}">

<link rel="icon"
      type="image/svg+xml"
      href="{% static 'frontend/assets/img/favicon/favicon.svg' %}">

<link rel="icon"
      type="image/png"
      sizes="96x96"
      href="{% static 'frontend/assets/img/favicon/favicon-96x96.png' %}">

<link rel="apple-touch-icon"
      sizes="180x180"
      href="{% static 'frontend/assets/img/favicon/apple-touch-icon.png' %}">

<link rel="manifest"
      href="{% static 'frontend/assets/img/favicon/site.webmanifest' %}">

<meta name="theme-color" content="#d7190f">


    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >


    <style>

        :root {

            --ff-red: #c31103;
            --ff-red-dark: #8f0c02;
            --ff-dark: #192736;
            --ff-text: #697481;
            --ff-border: #e4e7eb;
        }


        * {
            box-sizing: border-box;
        }


        body {

            min-height: 100vh;

            margin: 0;

            display: flex;

            align-items: center;
            justify-content: center;

            padding: 25px;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                radial-gradient(
                    circle at top left,
                    rgba(195, 17, 3, 0.10),
                    transparent 35%
                ),
                #f7f8fa;
        }


        .ff-staff-login {

            width: 100%;
            max-width: 450px;

            padding: 40px;

            border:
                1px solid
                var(--ff-border);

            border-radius: 28px;

            background: #ffffff;

            box-shadow:
                0
                25px
                70px
                rgba(25, 39, 54, 0.10);
        }


        .ff-login-icon {

            display: flex;

            width: 75px;
            height: 75px;

            margin:
                0
                auto
                22px;

            align-items: center;
            justify-content: center;

            border-radius: 50%;

            color: #ffffff;

            background: var(--ff-red);

            font-size: 29px;
        }


        .ff-staff-login h1 {

            margin:
                0
                0
                8px;

            color: var(--ff-dark);

            text-align: center;

            font-size: 27px;
            font-weight: 900;
        }


        .ff-staff-login > p {

            margin:
                0
                0
                28px;

            color: var(--ff-text);

            text-align: center;

            font-size: 13px;

            line-height: 1.6;
        }


        .ff-field {

            margin-bottom: 17px;
        }


        .ff-field label {

            display: block;

            margin-bottom: 8px;

            color: var(--ff-dark);

            font-size: 12px;
            font-weight: 800;
        }


        .ff-field input {

            width: 100%;

            height: 55px;

            padding:
                0
                16px;

            border:
                1px solid
                var(--ff-border);

            border-radius: 14px;

            outline: none;

            font-size: 14px;
        }


        .ff-field input:focus {

            border-color: var(--ff-red);

            box-shadow:
                0
                0
                0
                4px
                rgba(195, 17, 3, .08);
        }


        .ff-login-button {

            display: flex;

            width: 100%;

            min-height: 56px;

            margin-top: 7px;

            border: 0;

            border-radius: 28px;

            align-items: center;
            justify-content: center;

            gap: 9px;

            color: #ffffff;

            background: var(--ff-red);

            font-size: 14px;
            font-weight: 900;

            cursor: pointer;
        }


        .ff-login-button:hover {
            background: var(--ff-red-dark);
        }


        .ff-alert {

            margin-bottom: 18px;

            padding: 12px 14px;

            border-radius: 12px;

            font-size: 12px;
        }


        .ff-alert.error {

            color: #9a1c14;

            background: #fff0ee;
        }


        .ff-alert.success {

            color: #13773a;

            background: #eaf8ef;
        }

    </style>

</head>


<body>


<div class="ff-staff-login">


    <div class="ff-login-icon">

        <i class="fas fa-qrcode"></i>

    </div>


    <h1>
        Ticket Verification
    </h1>


    <p>
        Staff access only. Sign in to scan
        and verify Flying Fox tickets.
    </p>



    {% if messages %}

        {% for message in messages %}

            <div
                class="ff-alert {% if message.tags == 'success' %}success{% else %}error{% endif %}"
            >
                {{ message }}
            </div>

        {% endfor %}

    {% endif %}



    <form
        method="POST"
        action="{% url 'ticket_staff_login' %}"
    >

        {% csrf_token %}


        <div class="ff-field">

            <label>
                Username
            </label>

            <input
                type="text"
                name="username"
                autocomplete="username"
                placeholder="Enter staff username"
                required
            >

        </div>


        <div class="ff-field">

            <label>
                Password
            </label>

            <input
                type="password"
                name="password"
                autocomplete="current-password"
                placeholder="Enter password"
                required
            >

        </div>


        <button
            type="submit"
            class="ff-login-button"
        >

            <i class="fas fa-right-to-bracket"></i>

            Sign In

        </button>


    </form>


</div>


</body>

</html>
